[package]
name = "enigma_solver"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
colog = "1.4.0"
enigma = { git = "https://github.com/GuyOded/enigma-rust-lib.git", version = "6.0.0" }
itertools = "0.14.0"
log = "0.4.29"
ron = "0.12.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.17"
threadpool = "1.8.1"
